version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER:-kim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kim78%}
      POSTGRES_DB: ${DB_NAME:-apiSocialMeli}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - socialmeli-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kim}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  socialmeli-network: