version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: kim
      POSTGRES_PASSWORD: kim78%
      POSTGRES_DB: apiSocialMeli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - socialmeli-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialMeli"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: